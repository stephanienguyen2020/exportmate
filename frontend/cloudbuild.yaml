# Image build for the website, run by frontend/deploy.sh with the exportmate-builder service account
# (infra/terraform/build.tf). The script sets _IMAGE and the Firebase web config (public values).
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - --build-arg=VITE_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=VITE_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=VITE_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg=VITE_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - .
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
