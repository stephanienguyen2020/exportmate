[project]
name = "exportmate-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "firebase-admin>=6.6",
    "google-cloud-storage>=2.18",
    "fpdf2>=2.8",
    "google-genai>=1.0",
    "pgvector>=0.3",
    "pypdf>=5",
    "neo4j>=6.4.1",
    "mcp>=1.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.coverage.run]
# What the tests run of the backend: `uv run pytest --cov` (add --cov-report=html for htmlcov/).
source = ["app", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
