services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: exportmate
      POSTGRES_PASSWORD: exportmate
      POSTGRES_DB: exportmate
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:
