[project]
name = "exportmate-ml"
version = "0.1.0"
description = "Offline models for ExportMate, starting with news severity (docs: ml/README.md)."
requires-python = ">=3.11"
dependencies = [
    "google-cloud-firestore>=2.19",
    "google-genai>=1.0",
    "lightgbm>=4.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 110
